{{ define "main" }}
<article class="post-single container project-single">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</p>
  </header>
  <div class="project-detail-grid">
    <div class="project-description"><div class="post-body">{{ .Content }}</div></div>
    {{ with .Params.image }}
      <div class="project-gallery project-gallery-single">
        <img src="{{ printf "images/%s" . | relURL }}" alt="{{ $.Title }}">
      </div>
    {{ end }}
  </div>
</article>
{{ end }}
