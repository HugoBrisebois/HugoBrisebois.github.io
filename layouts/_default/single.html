{{ define "main" }}
<article class="post-single container">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">{{ .Date.Format "Jan 2, 2006" }}</p>
    {{ with .Params.subtitle }}<p class="post-subtitle">{{ . }}</p>{{ end }}
  </header>
  <div class="post-body">
    {{ .Content }}
  </div>
  {{ if eq .Section "projects" }}
  {{ $imageCount := len .Params.images }}
  <div class="project-gallery{{ if eq $imageCount 1 }} project-gallery-single{{ end }}">
    {{ range .Params.images }}
      <img src="{{ . | relURL }}" alt="{{ $.Title }}" />
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
