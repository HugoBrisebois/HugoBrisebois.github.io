<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Primary navigation">
      {{ range site.Menus.main }}
        {{ $menuPath := trim .URL "/" }}
        {{ $current := or (and (eq $menuPath "") $.IsHome) (and (ne $menuPath "") (or (eq $menuPath (trim $.RelPermalink "/")) (eq $menuPath $.Section))) }}
        <a href="{{ .URL | relURL }}" class="{{ if eq .Name "Photos" }}nav-photos {{ end }}{{ if $current }}is-current{{ end }}"{{ if $current }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
